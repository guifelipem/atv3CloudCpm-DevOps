<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autores</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><h1>Autores</h1><nav><a href="/">Início</a><a href="/livros">Livros</a></nav></header><main><section class="panel"><h2>Novo autor</h2><form method="post" action="/autores" class="grid-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="nome" placeholder="Nome" required><input name="nacionalidade" placeholder="Nacionalidade" required><button>Cadastrar</button></form></section><section class="panel"><h2>Autores cadastrados</h2><table><thead><tr><th>ID</th><th>Nome</th><th>Nacionalidade</th><th>Ação</th></tr></thead><tbody><tr th:each="a : ${autores}"><td th:text="${a.id}"></td><td th:text="${a.nome}"></td><td th:text="${a.nacionalidade}"></td><td><a th:href="@{/autores/excluir/{id}(id=${a.id})}">Excluir</a></td></tr></tbody></table></section></main></body></html>
