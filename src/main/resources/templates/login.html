<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Biblioteca</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="login-page"><main class="login-card"><h1>Biblioteca Cloud</h1><p>Projeto acadêmico com Spring Boot, Docker e Kubernetes.</p><form method="post" action="/login"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Usuário<input name="username" required autofocus></label><label>Senha<input name="password" type="password" required></label><button>Entrar</button></form><div class="hint"><strong>Acesso acadêmico</strong><br>admin / admin<br>user / user</div></main></body></html>
