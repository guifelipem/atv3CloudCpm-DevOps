<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Livros</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><h1>Livros</h1><nav><a href="/">Início</a><a href="/autores">Autores</a></nav></header><main><section class="panel"><h2>Novo livro</h2><form method="post" action="/livros" class="grid-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="titulo" placeholder="Título" required><input name="isbn" placeholder="ISBN" required><select name="autorId" required><option value="">Selecione o autor</option><option th:each="a : ${autores}" th:value="${a.id}" th:text="${a.nome}"></option></select><button>Cadastrar</button></form></section><section class="panel"><h2>Livros cadastrados</h2><table><thead><tr><th>ID</th><th>Título</th><th>ISBN</th><th>Autor</th><th>Ação</th></tr></thead><tbody><tr th:each="l : ${livros}"><td th:text="${l.id}"></td><td th:text="${l.titulo}"></td><td th:text="${l.isbn}"></td><td th:text="${l.autor.nome}"></td><td><a th:href="@{/livros/excluir/{id}(id=${l.id})}">Excluir</a></td></tr></tbody></table></section></main></body></html>
